name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check version matches tag
        run: |
          version=$(jq -r .version custom_components/offline_laundry/manifest.json)
          test "v$version" = "${{ github.event.release.tag_name }}"
      - name: Build card
        working-directory: frontend
        run: npm ci && npm run build
      - name: Zip integration
        working-directory: custom_components/offline_laundry
        run: zip -r "$GITHUB_WORKSPACE/offline_laundry.zip" . -x "__pycache__/*"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" offline_laundry.zip
