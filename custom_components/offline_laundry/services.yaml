  target:
    entity:
      integration: offline_laundry
      domain: sensor
      device_class: enum

resume:
  target:
    entity:
      integration: offline_laundry
      domain: sensor
      device_class: enum

cancel:
  target:
    entity:
      integration: offline_laundry
      domain: sensor
      device_class: enum

empty:
  target:
    entity:
      integration: offline_laundry
      domain: sensor
      device_class: enum
